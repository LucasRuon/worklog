<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f9fa">
  <title>Worklog — Seu trabalho por projeto</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg class="icon-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="i-overview" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M3 11h18"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-export" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 16v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></symbol>
    <symbol id="i-plug" viewBox="0 0 24 24"><path d="M8 3v5m8-5v5M6 8h12v3a6 6 0 0 1-12 0Zm6 9v4"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 11h18"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v1"/></symbol>
    <symbol id="i-git" viewBox="0 0 24 24"><circle cx="6" cy="5" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="6" cy="19" r="2"/><path d="M6 7v10m12-9a8 8 0 0 1-8 8H6"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H5v18h14V8Zm0 0v5h5M8 12h8m-8 4h5"/></symbol>
  </defs></svg>
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#overview" aria-label="Worklog, visão geral"><span class="brand-mark"><i></i><i></i><i></i></span>worklog<span class="brand-period">.</span></a>
    <div class="workspace"><span class="avatar">LR</span><span>Meu espaço<span class="workspace-sub">Lucas Ruon</span></span><span class="local-tag">Local</span></div>
    <nav aria-label="Navegação principal">
      <a href="#overview" class="nav-link active" data-nav="overview"><svg><use href="#i-overview"/></svg>Visão geral</a>
      <a href="#projects" class="nav-link" data-nav="projects"><svg><use href="#i-folder"/></svg>Projetos<span class="nav-count">4</span></a>
      <a href="#activity" class="nav-link" data-nav="activity"><svg><use href="#i-clock"/></svg>Atividades</a>
      <a href="#exports" class="nav-link" data-nav="exports"><svg><use href="#i-export"/></svg>Exportações</a>
    </nav>
    <div class="sidebar-projects"><p class="sidebar-label">Projetos nesta prévia</p><div id="sidebar-project-list"></div></div>
    <div class="sidebar-bottom"><a href="#integrations" class="nav-link" data-nav="integrations"><svg><use href="#i-plug"/></svg>Integrações</a><div class="preview-note"><span class="preview-dot"></span><span>Modo demonstração<small>Dados ilustrativos · sem coleta</small></span></div></div>
  </aside>
  <div class="mobile-scrim" id="scrim"></div>
  <div class="app-shell">
    <header class="topbar"><div class="breadcrumbs"><button class="icon-btn mobile-menu" aria-label="Abrir navegação" aria-expanded="false" id="menu-toggle"><svg><use href="#i-menu"/></svg></button><span>Meu espaço</span><svg><use href="#i-chevron"/></svg><span id="breadcrumb-current">Visão geral</span></div><div class="topbar-right"><span class="preview-badge">Prévia interativa</span><span class="topbar-date">Quinta, 5 de novembro de 2026</span><span class="avatar small">LR</span></div></header>
    <main id="main" tabindex="-1"></main>
    <footer class="app-footer"><span>Seu trabalho, com contexto.</span><span>Worklog · Prévia de design</span></footer>
  </div>
  <dialog id="session-dialog" class="detail-dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
